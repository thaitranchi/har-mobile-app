name: Mobile CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: mobile-ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HeritageAtRisk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: HeritageAtRisk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest
        run: npx jest --runInBand

  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    defaults:
      run:
        working-directory: HeritageAtRisk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: HeritageAtRisk/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: HeritageAtRisk/android

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: heritage-at-risk-release-apk
          path: HeritageAtRisk/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
